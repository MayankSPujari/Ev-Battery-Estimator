version: '3.8'

services:
  api:
    build: .
    container_name: ev_api
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: ev_celery_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A backend.api.workers.celery_app worker --loglevel=info
    depends_on:
      - redis

  dashboard:
    build: .
    container_name: ev_dashboard
    ports:
      - "8501:8501"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    command: streamlit run frontend/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

  redis:
    image: redis:7-alpine
    container_name: ev_redis
    ports:
      - "6379:6379"
