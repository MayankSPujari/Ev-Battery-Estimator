apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-api-deployment
  labels:
    app: ev-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ev-api
  template:
    metadata:
      labels:
        app: ev-api
    spec:
      containers:
      - name: ev-api
        image: ev-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: APP_HOST
          value: "0.0.0.0"
        - name: APP_PORT
          value: "8000"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
