apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: ev-api-routing
spec:
  hosts:
  - "api.ev-range.com"
  gateways:
  - ev-gateway
  http:
  - match:
    - headers:
        x-inference-tier:
          exact: "premium"
    route:
    - destination:
        host: ev-api-service
        subset: premium-gpu
  - route:
    - destination:
        host: ev-api-service
        subset: standard-cpu
